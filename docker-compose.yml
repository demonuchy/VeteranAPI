services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ../veterans-community-app/build:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    networks:
      - app-net

  db:
    image: postgres:15-alpine
    container_name: db
    hostname: postgres
    restart: unless-stopped 
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    command: >
      postgres
      -c log_min_messages=warning     
      -c log_statement=none           
      -c log_duration=off            
      -c log_connections=off
      -c log_disconnections=off 
    volumes:
      - postgres-data:/var/lib/postgresql/data 
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:                                
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5 
      start_period: 20s
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - app-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - node.name=elasticsearch
      - cluster.name=docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.monitoring.collection.enabled=true
      - logger.org.elasticsearch=ERROR
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - app-net

  redis: 
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      redis-server 
      --requirepass ${REDIS_PASS} 
      --loglevel warning  
      --logfile "" 
      --daemonize no 
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-net
      
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"  # API порт
      - "127.0.0.1:9001:9001"  # Console порт
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - app-net

  api:
    build: .
    container_name: api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      IN_DOCKER: 'true'
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src 
      - ./alembic.ini:/app/alembic.ini 
      - ./.env:/app/.env
    depends_on:
      db:
        condition: service_healthy
      redis: 
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - app-net

  # ============================================
  # pgAdmin - управление PostgreSQL
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "127.0.0.1:5050:80"  # http://localhost:5050
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    ports:
      - "5051:5540"  # 5540 - правильный порт для версии 2.x
    environment:
      - RI_APP_PORT=5540  # Явно указать порт
    volumes:
      - redis-insight-data:/db
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  elasticsearch-data:
  pgadmin-data:  
  redis-insight-data:

networks:
  app-net:
    driver: bridge 
